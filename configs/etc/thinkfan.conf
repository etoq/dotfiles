sensors:
  # Процессор (Package + Cores)
  - hwmon: /sys/class/hwmon
    name: coretemp
    indices: [1, 2, 3, 4, 5]

  # ThinkPad ACPI (EC датчики)
  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1, 2]

  # acpitz удалён — дублирует coretemp, провоцировал
  # преждевременный спин-ап

fans:
  - tpacpi: /proc/acpi/ibm/fan

# Thinkfan 1.x автоматически конвертирует millidegrees → °C
# Все значения ниже — в градусах Цельсия
# Реагирует на МАКСИМУМ среди всех сенсоров
levels:
  - [0,     0,  60]    # вентилятор выкл — холостой ход
  - [1,    53,  65]    # едва слышный минимум
  - [2,    59,  70]    # лёгкая нагрузка
  - [3,    64,  74]    # средняя нагрузка
  - [4,    68,  78]    # активная работа
  - [5,    72,  82]    # тяжёлая нагрузка (VM + компиляция)
  - [6,    76,  86]    # очень тяжёлая нагрузка
  - [7,    80,  90]    # интенсивная нагрузка
  - [127,  84, 255]    # full speed — критическая температура
