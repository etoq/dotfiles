# /etc/thinkfan-silent.conf
# Профиль: максимально тихий — выезд / лёгкая работа
# Трейдоф: под тяжёлой нагрузкой CPU может троттлить — это ок,
# потому что профиль не для компиляции/VM

sensors:
  - hwmon: /sys/class/hwmon
    name: coretemp
    indices: [1, 2, 3, 4, 5]

  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1, 2]
    max_errors: 3

fans:
  - tpacpi: /proc/acpi/ibm/fan

levels:
  - [0,     0,  67]    # вентилятор выкл — максимально долго
  - [1,    60,  74]    # едва слышный шёпот
  - [2,    68,  80]    # тихий фон
  - [3,    75,  86]    # заметный только в тишине
  - [4,    82,  90]    # резерв перед аварией
  - [127,  87, 255]    # full speed — критическая защита
