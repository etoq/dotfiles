#!/usr/sbin/nft -f
# Replace only workstation-owned tables; leave libvirt and Throne tables intact.
destroy table inet filter
destroy table ip nat

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        # Offline laboratory: replies to host-initiated sessions and DHCP only.
        iifname "virbr1" ct state established,related accept comment "lab-host-initiated-replies"
        iifname "virbr1" udp sport 68 udp dport 67 accept
        iifname "virbr1" drop
        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept
        iifname "enp0s31f6" ip saddr 192.168.0.0/24 tcp dport 53317 accept comment "localsend-home-lan-tcp"
        iifname "enp0s31f6" ip saddr 192.168.0.0/24 udp dport 53317 accept comment "localsend-home-lan-udp"
        tcp dport 3427 accept
        ip protocol icmp icmp type echo-request limit rate 10/second accept
        ip6 nexthdr icmpv6 accept
        iifname "virbr0" accept
        limit rate 5/second burst 10 packets log prefix "[nft-drop] " flags all
        drop
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
        iifname "virbr1" drop
        oifname "virbr1" drop
        iifname "virbr0" oifname { "wlan0", "enp0s31f6", "throne-tun" } accept
        iifname { "wlan0", "enp0s31f6", "throne-tun" } oifname "virbr0" ct state established,related accept
        iifname "virbr0" oifname "tun*" accept
        iifname "tun*" oifname "virbr0" ct state established,related accept
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr 192.168.122.0/24 masquerade
    }
}
