# ── Шрифт ─────────────────────────────────────
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
font_size 11.3
# ── Black Tiffany Colors ────────────────────────────
foreground #C5D6D8
background #080D10
background_opacity 0.7
selection_foreground #ffffff
selection_background #183039
# Black
color0 #101B20
color8 #7E999F
# Red
color1 #DE7C86
color9 #E7989F
# Green
color2 #8DC99B
color10 #A7D9B0
# Yellow
color3 #D8B77B
color11 #E3CAA1
# Blue/Purple
color4 #0ABAB5
color12 #4DDDD5
# Pink
color5 #4DDDD5
color13 #A3F0E7
# Cyan
color6 #4DDDD5
color14 #A3F0E7
# White
color7 #C5D6D8
color15 #FFFFFF
# ── Курсор ────────────────────────────────────
cursor #0ABAB5
cursor_text_color #080D10
cursor_shape beam
cursor_trail 1
cursor_blink_interval 0.5
# ── Окно ──────────────────────────────────────
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0
# ── Tab bar ───────────────────────────────────
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background #080D10
tab_title_template '{index}: {title}'
active_tab_foreground #080D10
active_tab_background #0ABAB5
inactive_tab_foreground #7E999F
inactive_tab_background #101B20
# ── URL ───────────────────────────────────────
url_color #4DDDD5
url_style curly
open_url_with default
# ── Производительность ────────────────────────
repaint_delay 8
input_delay 2
sync_to_monitor yes
shell fish
