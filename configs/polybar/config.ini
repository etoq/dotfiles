[bar/main]
monitor = ${env:MONITOR:}
width = 98%
offset-x = 1%
offset-y = 8
height = 34
radius = 10
background = #E6080D10
foreground = #C5D6D8
border-size = 1
border-color = #183039
line-size = 2
padding = 2
module-margin = 1
font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=12;3
font-1 = JetBrainsMono Nerd Font:pixelsize=16;4
wm-restack = bspwm
enable-ipc = true
modules-left = deck bspwm timer
modules-center = music
modules-right = stats network sound battery clock tray tray-toggle

[bar/secondary]
inherit = bar/main
modules-right = stats network sound battery clock

[module/deck]
type = custom/text
label = 󰕮 ZER0
label-foreground = #0ABAB5
click-left = $HOME/.local/bin/panel-action dashboard
click-right = $HOME/.local/bin/panel-action switch

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
label-focused = %index%
label-focused-foreground = #4DDDD5
label-focused-underline = #0ABAB5
label-focused-padding = 1
label-occupied = %index%
label-occupied-foreground = #C5D6D8
label-occupied-padding = 1
label-empty = ·
label-empty-foreground = #7E999F
label-empty-padding = 1


[module/music]
type = custom/script
exec = $HOME/.local/bin/panel-data field polybar_media
interval = 1
label = %output:0:34:…%
label-foreground = #A3F0E7
click-left = $HOME/.local/bin/panel-action media
click-right = $HOME/.local/bin/panel-action next
scroll-up = $HOME/.local/bin/panel-action previous
scroll-down = $HOME/.local/bin/panel-action next

[module/stats]
type = custom/script
exec = $HOME/.local/bin/panel-data field polybar_stats
interval = 2
label = %output%
label-foreground = #C99070
click-left = $HOME/.local/bin/panel-action monitor
click-right = $HOME/.local/bin/panel-action dashboard

[module/network]
type = custom/script
exec = $HOME/.local/bin/panel-data field net_label
interval = 3
label = 󰈀 %output%
label-foreground = #4DDDD5
click-left = $HOME/.local/bin/panel-action network
click-right = $HOME/.local/bin/panel-action vpn

[module/sound]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
label-volume = 󰕾 %percentage%%
label-volume-foreground = #D35F5E
format-muted = <label-muted>
label-muted = 󰖁 %percentage%%
label-muted-foreground = #7E999F
click-left = $HOME/.local/bin/panel-action mute
click-right = pavucontrol
scroll-up = $HOME/.local/bin/panel-action volume-up
scroll-down = $HOME/.local/bin/panel-action volume-down

[module/battery]
type = custom/script
exec = $HOME/.local/bin/panel-data field battery_label
interval = 5
label = %output%
label-foreground = #8DC99B
click-left = $HOME/.local/bin/panel-action dashboard

[module/clock]
type = internal/date
interval = 1
date = %H:%M
date-alt = %a %d %b · %H:%M
label = %date%
label-foreground = #A3F0E7
click-right = $HOME/.local/bin/panel-action calendar

[module/timer]
type = custom/script
exec = $HOME/.local/bin/study bar
interval = 1
label = %output%
label-foreground = #4DDDD5
click-left = kitty --class otter-tools -e $HOME/.local/bin/study

[module/tray]
type = internal/tray
hidden = true
tray-spacing = 8
tray-size = 16

[module/tray-toggle]
type = custom/text
label = 󰅀
label-foreground = #0ABAB5
label-padding = 1
click-left = #tray.module_toggle
